<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTO GÜVEN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#dcdcdc;
}

/* ÜST SARI BLOK */
.top-bar{
    width:100%;
    height:90px;
    background:#ffea00;
    border-bottom:5px solid black;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}

.left-text{
    font-size:22px;
    font-weight:bold;
    color:black;
}

.left-text span{
    font-weight:normal;
    margin-left:10px;
}

.right-logos{
    display:flex;
    align-items:center;
    gap:20px;
}

.right-logos img{
    height:60px;
}

/* ORTA ALAN */
.main{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:50px;
}

/* SLIDER */
.slider{
    position:relative;
    width:1200px;
    height:1000px;
    overflow:hidden;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
    margin-bottom:30px;
    background:#fff;
}

/* SLIDES */
.slides{
    display:flex;
    height:100%;
    transition:transform 0.6s ease;
}

.slide{
    min-width:100%;
    height:100%;
    flex-shrink:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* OKLAR */
.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.6);
    color:white;
    font-size:30px;
    padding:10px 15px;
    cursor:pointer;
    border-radius:5px;
    user-select:none;
}

.arrow.left{ left:20px; }
.arrow.right{ right:20px; }

/* NOKTALAR */
.dots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:40px;
}

.dot{
    width:12px;
    height:12px;
    background:#999;
    border-radius:50%;
    cursor:pointer;
    transition:0.3s;
}

.dot.active{
    background:black;
    transform:scale(1.3);
}

/* BUTONLAR */
.button-area{
    width:1200px;
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:80px;
}

.custom-btn{
    flex:1;
    padding:14px;
    background:black;
    color:white;
    text-align:center;
    font-size:18px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    text-decoration:none;
    display:block;
}

.custom-btn:hover{
    background:#ffea00;
    color:black;
    transform:scale(1.04);
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="left-text">
        OTO GÜVEN 
        <span>| Oto Yedek Parça Tamir Bakım Özel Servisi</span>
    </div>

    <div class="right-logos">
        <img src="logo.png">
        <img src="logo1.png">
    </div>
</div>

<div class="main">

    <div class="slider">

        <div class="slides" id="slides">
            <div class="slide"><img src="fotoraf1.jpg"></div>
            <div class="slide"><img src="fotoraf2.jpg"></div>
            <div class="slide"><img src="fotoraf3.jpg"></div>
            <div class="slide"><img src="fotoraf4.jpg"></div>
            <div class="slide"><img src="fotoraf5.jpg"></div>
            <div class="slide"><img src="fotoraf6.jpg"></div>
            <div class="slide"><img src="fotoraf7.jpg"></div>
            <div class="slide"><img src="fotoraf8.jpg"></div>
        </div>

        <div class="arrow left" onclick="prevSlide()">❮</div>
        <div class="arrow right" onclick="nextSlide()">❯</div>

    </div>

    <!-- NOKTA GÖSTERGESİ -->
    <div class="dots" id="dots"></div>

    <div class="button-area">
        <a href="dukkansahibi.html" class="custom-btn">Dükkan Sahibi</a>
        <div class="custom-btn">İletişim Bilgileri</div>
        <div class="custom-btn">Dükkan Tanıtımı</div>
    </div>

</div>

<script>
let currentIndex = 0;
const slides = document.getElementById("slides");
const totalSlides = 8;
const dotsContainer = document.getElementById("dots");

/* Noktaları oluştur */
for(let i=0; i<totalSlides; i++){
    const dot = document.createElement("div");
    dot.classList.add("dot");
    if(i === 0) dot.classList.add("active");
    dot.addEventListener("click", function(){
        currentIndex = i;
        updateSlider();
    });
    dotsContainer.appendChild(dot);
}

function updateSlider(){
    slides.style.transform = "translateX(" + (-currentIndex * 100) + "%)";
    document.querySelectorAll(".dot").forEach((dot, index)=>{
        dot.classList.toggle("active", index === currentIndex);
    });
}

function nextSlide(){
    currentIndex = (currentIndex + 1) % totalSlides;
    updateSlider();
}

function prevSlide(){
    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
    updateSlider();
}
</script>

</body>
</html>
