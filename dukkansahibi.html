<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dükkan Sahibi - OTO GÜVEN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#dcdcdc;
}

/* ÜST SARI BLOK */
.top-bar{
    width:100%;
    height:90px;
    background:#ffea00;
    border-bottom:5px solid black;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
}

.left-text{
    font-size:22px;
    font-weight:bold;
    color:black;
}

.left-text span{
    font-weight:normal;
    margin-left:10px;
}

.right-logos{
    display:flex;
    align-items:center;
    gap:20px;
}

.right-logos img{
    height:60px;
}

/* ANA İÇERİK */
.main{
    width:1200px;
    margin:60px auto;
}

/* İSİM */
.owner-name{
    font-size:36px;
    font-weight:bold;
    margin-bottom:30px;
}

/* FOTO ALANI */
.photo-box{
    width:750px;
    height:750px;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    margin-bottom:30px;
}

.photo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* AÇIKLAMA */
.description{
    width:750px;
    font-size:20px;
    line-height:1.6;
    text-align:justify;
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="left-text">
        OTO GÜVEN 
        <span>| Oto Yedek Parça Tamir Bakım Özel Servisi</span>
    </div>

    <div class="right-logos">
        <img src="logo.png">
        <img src="logo1.png">
    </div>
</div>

<div class="main">

    <div class="owner-name">
        Recep Eker
    </div>

    <div class="photo-box">
        <img src="dukkansahibi.jpeg">
    </div>

    <div class="description">
        Dükkanın ve Otogüven markasının tecrübeli kişisi ve sahibi Recep Eker dükkanın ustası ve sahibidir.Kendisi aslen Düzce'li olup bu işleri yapmaya çok küçük yaşlarda başlamıştır.
    </div>

</div>

</body>
</html>
